---
- name: Ensure the NFS client package is installed
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure the export is mounted and persisted in fstab
  ansible.posix.mount:
    path: "{{ backup_infra_client_mount_path }}"
    src: "{{ hostvars[backup_infra_storage_host].ansible_host }}:{{ backup_infra_server_mount_path }}"
    fstype: nfs
    # _netdev tells systemd this mount depends on the network, so boot does
    # not race the interface coming up. A local disk mount does not need it.
    opts: defaults,_netdev
    state: mounted
