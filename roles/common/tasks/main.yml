---
- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Ensure unattended-upgrades is installed
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true

- name: Restrict unattended upgrades to security patches
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-security-only
    content: |
      // Managed by Ansible (roles/common).
      // Kernel and pve-manager are excluded: those upgrades are applied
      // manually in a scheduled window, one node at a time, because a
      // node reboot is a service outage under ADR 0006.
      Unattended-Upgrade::Origins-Pattern {
          "origin=Debian,codename=${distro_codename},label=Debian-Security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
    mode: "0644"
  when: unattended_security_only | default(true)

# Discovered while testing roles/backup_infra: both nodes shipped with
# /etc/resolv.conf pointing at a public resolver. That answers
# for the internet fine, but the .lan zone is only authoritative on the
# router (ADR 0007), so node-to-node lookups of pve1.lan/pve2.lan returned
# NXDOMAIN instead of forwarding. This surfaced as an NFS mount failure,
# not a DNS error, which cost real time to trace back.
#
# The router's address is read from the gateway each node already has in
# its own network config (ansible_facts['default_ipv4']['gateway']),
# rather than written here as a literal, per this repository's rule
# against committing IP addresses in plain text.
- name: Ensure the node resolves internal DNS through the router
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # Managed by Ansible (roles/common).
      # The router is authoritative for the .lan zone (ADR 0007) and
      # forwards everything else. A public resolver here returns
      # NXDOMAIN for internal names instead of forwarding to the router.
      search asymptora.local
      nameserver {{ ansible_facts['default_ipv4']['gateway'] }}
    mode: "0644"

# journald retention was never declared anywhere: RFC 0001's acceptance
# criteria for this issue names it explicitly (Storage=persistent,
# SystemMaxUse=500M, MaxRetentionSec=90days), and neither node had a
# drop-in for it before this task existed.
- name: Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure journald retention
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-retention.conf
    content: |
      # Managed by Ansible (roles/common).
      [Journal]
      Storage=persistent
      SystemMaxUse=500M
      MaxRetentionSec=90days
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
