---
# Nodes are addressed by name, not by IP. The router publishes these
# records statically, independently of any DHCP lease, as recorded in
# ADR 0007. This keeps concrete addressing out of version control and
# survives a change of addressing. The tradeoff is a dependency on local
# DNS: if the router is unavailable, name resolution fails before Ansible
# reaches the nodes, which is a visible and expected failure at this scale.
all:
  children:
    proxmox_nodes:
      hosts:
        pve1:
          ansible_host: pve1.lan
          node_role: primary
        pve2:
          ansible_host: pve2.lan
          node_role: support
      vars:
        ansible_python_interpreter: /usr/bin/python3
