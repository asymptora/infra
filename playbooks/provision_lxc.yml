---
# Node placement is an operator decision under the colocation rule in
# ADR 0006, so the target is always constrained with -l.
#
#   ansible-playbook playbooks/provision_lxc.yml -l pve1 \
#     -e lxc_ctid=105 -e lxc_hostname=<name> \
#     -e lxc_ssh_public_key_path=~/.ssh/id_ed25519.pub
- name: Provision an LXC container
  hosts: proxmox_nodes
  gather_facts: false
  roles:
    - lxc_provision
