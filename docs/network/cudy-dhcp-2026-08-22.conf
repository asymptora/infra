# Export de /etc/config/dhcp — Cudy WR3000 v1 (OpenWrt 25.12.5)
# Gerado com: uci export dhcp
# Data: 2026-08-22
# Contexto: após aplicação das reservas (config host) e nomes DNS estáticos
#           (config domain) para pve1 e pve2. Ver docs/network/topology-and-addressing.md §7.

package dhcp

config dnsmasq
	option domainneeded '1'
	option boguspriv '1'
	option filterwin2k '0'
	option localise_queries '1'
	option rebind_protection '1'
	option rebind_localhost '1'
	option local '/lan/'
	option domain 'lan'
	option expandhosts '1'
	option nonegcache '0'
	option cachesize '1000'
	option authoritative '1'
	option readethers '1'
	option leasefile '/tmp/dhcp.leases'
	option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'
	option nonwildcard '1'
	option localservice '1'
	option ednspacket_max '1232'
	option filter_aaaa '0'
	option filter_a '0'
	list server '1.1.1.1'
	list server '8.8.8.8'
	option noresolv '1'
	option logqueries '0'

config dhcp 'lan'
	option interface 'lan'
	option start '100'
	option limit '150'
	option leasetime '12h'
	option dhcpv4 'server'
	option dhcpv6 'server'
	option ra 'server'
	list ra_flags 'managed-config'
	list ra_flags 'other-config'
	option ra_slaac '1'

config dhcp 'wan'
	option interface 'wan'
	option ignore '1'

config odhcpd 'odhcpd'
	option maindhcp '0'
	option leasefile '/tmp/odhcpd.leases'
	option leasetrigger '/usr/sbin/odhcpd-update'
	option loglevel '4'
	option piodir '/tmp/odhcpd-piodir'
	option hostsdir '/tmp/hosts'

config dhcp 'iot'
	option interface 'iot'
	option start '100'
	option limit '150'
	option leasetime '12h'

config dhcp 'familia'
	option interface 'familia'
	option start '100'
	option limit '150'
	option leasetime '12h'

# Reserva de IP: impede o pool dinamico de ofertar .10/.11 a outro cliente.
# NAO publica nome em DNS para hosts com IP estatico (sem DHCPDISCOVER) — ver config domain abaixo.
config host 'pve1'
	option name 'pve1'
	option mac '10:63:C8:D7:45:B1'
	option ip '192.168.1.10'

config host 'pve2'
	option name 'pve2'
	option mac '98:83:89:D9:5A:6B'
	option ip '192.168.1.11'

# Registro DNS estatico: publica pve1.lan / pve2.lan independentemente de lease DHCP.
# Necessario porque os hipervisores tem IP estatico em /etc/network/interfaces e
# nunca disparam DHCPDISCOVER. Ver docs/network/topology-and-addressing.md §7.
config domain
	option name 'pve1'
	option ip '192.168.1.10'

config domain
	option name 'pve2'
	option ip '192.168.1.11'
