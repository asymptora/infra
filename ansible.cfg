[defaults]
inventory = inventories/production/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent

# remote_user is deliberately unset. Ansible connects as the account
# running the playbook on the control node, so each operator reaches the
# nodes under their own identity. Per operator connection details belong
# in ~/.ssh/config on the control node, never in this repository.

[privilege_escalation]
become = True
become_method = sudo

# Operator accounts hold passwordless sudo on the nodes. The
# authentication boundary is the SSH key, which is per identity and
# revocable by removing it from authorized_keys. Requiring an interactive
# sudo password on top of that would block unattended runs, such as the
# scheduled maintenance playbook, without narrowing who can escalate.
become_ask_pass = False
